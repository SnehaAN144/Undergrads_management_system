spring.application.name=undergrads-management-system
#Gives your Spring Boot application a name.

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:undergradsdb
#This tells Spring:
#- h2 → use H2 database
#- mem → database is stored in memory
#- undergradsdb → database name
spring.datasource.driverClassName=org.h2.Driver

spring.datasource.username=sa
spring.datasource.password=

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#Hibernate uses this to understand how to communicate with the H2 database and generate database-specific SQL.
spring.jpa.hibernate.ddl-auto=update
#Automatically create/update tables

# Show SQL queries in console
spring.jpa.show-sql=true
#Whenever your repository performs database operations, you'll see SQL queries in your IntelliJ console.
# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console